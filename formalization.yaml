status:
  scope: >-
    Proved for every finite vertex type, every p ≥ 1 and every t ≥ 0 (Füredi's theorem, the
    partition inequality and the edit-distance form); for every p ≥ 1 and ε > 0 (stability for
    K_{p+1}, uniformly over all finite graphs); for every finite (p + 1)-colourable L, p ≥ 1 and
    ε > 0, for graphs on at least n₀ vertices (general Erdős–Simonovits stability); for every
    clique size r (counting and removal lemmas); and for every finite graph with a proper
    colouring (embedding lemma).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "autonomous"
      models: ["Aristotle (Harmonic)"]
      framework: "Aristotle CLI"
      tool_setup: >-
        Produced the proofs in five runs (Füredi; clique counting; clique removal; embedding;
        general stability), each from formal statements and a proof plan that reused Mathlib's
        regularity and triangle-removal developments and the previously proved files; each
        return was audited (statements and headers unchanged, no added axioms) and rebuilt
        locally. In the counting run Aristotle found that a first draft of the robust-density
        counting statement was false without the hypothesis η ≤ 1 and gave a machine-checked
        counterexample; the statement was corrected.
      cost:
        wall_time: "about four hours in total"
        spend_usd: "not tracked"
        hardware: "API-only"
      prompting_notes: "Formal statements and proof plans supplied."
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code (Anthropic)"
      tool_setup: >-
        Statement design, proof plans, integration and review of the Aristotle returns, and the
        Palomar packaging, checked with `lake build` and `#print axioms` (Lean v4.35.0-rc3,
        Mathlib c55e6e786f49471c72fbddbec5415808896aec1e).
      cost:
        wall_time: "about three hours"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "Natural-language instructions in Spanish, directed by the author."
  spend_usd: "subscription-based"
  notes: >-
    The results were chosen by the human author; the Lean proofs are AI-generated and
    mechanically verified (no `sorry`, axioms limited to propext, Classical.choice and Quot.sound,
    identical elaborated types for the Challenge/Solution pair).

fidelity:
  divergences: >-
    Edge counts are `Set.ncard` of Mathlib's `edgeSet` (or `edgeFinset` cards in the removal
    lemma, as in Mathlib's triangle removal lemma); t(n, p) is Mathlib's `turanNumber n p`. A
    p-partition is a map f : V → Fin p, its complete p-partite graph is
    `(⊤ : SimpleGraph (Fin p)).comap f`, the edges inside the parts are those of `G \ ⊤.comap f`,
    and the edit distance is the edge count of the symmetric difference. A "p-partite subgraph" is
    H ≤ G with `H.Colorable p`. Füredi's hypothesis is stated as t(n, p) ≤ e(G) + t. In the general
    stability theorem the forbidden graph is any L with `L.Colorable (p + 1)` (χ(L) ≤ p + 1),
    containment is Mathlib's `IsContained`, and the conclusion holds for n ≥ n₀ (necessary: e.g.
    K_n with p ≤ n < |V(L)| is L-free, dense and far from p-partite). The counting lemma is stated
    for parts given by s : Fin r → Finset α with transversal tuples in `Fintype.piFinset s`, with
    the explicit bound d^(r choose 2) / 2^r · ∏ #(s i) under 2 r η ≤ d^(r−1); the removal lemma
    and the stability theorems give only existential constants.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (AI agent in Claude Code, acting for the author)"
  notes: >-
    Agent review by Claude Opus 5.5, distinct from the mechanical verification: the agent
    compared the statements with Füredi's theorem, the Erdős–Simonovits theorem and the standard
    counting, removal and embedding lemmas, checked edge cases (which led to the hypotheses
    η ≤ 1, d ≤ 1 and n ≥ n₀), checked that each Aristotle return left every statement and header
    unchanged, and confirmed by `lake build`, `#print axioms` and a comparison of the fully
    elaborated Challenge and Solution types that the proofs use no `sorry` and only propext,
    Classical.choice and Quot.sound. The author directed the work and approved the statements.
    No independent human mathematical review has been performed. The results are known; no
    mathematical novelty is claimed.

