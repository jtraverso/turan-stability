# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Füredi's stability theorem and the Erdős–Simonovits stability theorem"
  description: >-
    A Lean 4 / Mathlib formalization of the stability theory of Turán's theorem. (1) Füredi's
    sharp stability theorem for cliques: a K_{p+1}-free graph on n vertices with at least
    t(n, p) − t edges (t(n, p) the number of edges of the Turán graph) has a p-partite subgraph
    with at least e(G) − t edges, via Füredi's partition inequality
    e(G) + Σᵢ e(G[Vᵢ]) ≤ e(K(V₁, …, V_p)); also edit distance at most 3t to a complete p-partite
    graph. (2) The Erdős–Simonovits stability theorem for every forbidden graph L with
    χ(L) ≤ p + 1: for every ε > 0 there are δ > 0 and n₀ such that every L-free graph on n ≥ n₀
    vertices with at least (1 − 1/p) n²/2 − δn² edges differs from a complete p-partite graph in
    at most εn² edges, derived as in Füredi's paper from the regularity method. For this, the
    project extends Mathlib's regularity theory, which only treats triangles, with (3) the clique
    counting lemma in ε-uniform parts, (4) the clique removal lemma (fewer than δn^r copies of K_r
    can be destroyed by deleting fewer than εn² edges) and (5) the embedding lemma for any fixed
    graph with a proper colouring into pairwise uniform dense parts. Mathlib has Turán's theorem,
    Szemerédi's regularity lemma and triangle counting/removal, but none of (1)–(5).
  authors:
    - "Juan Pablo Traverso Gianini"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Juan Pablo Traverso Gianini"

