# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Füredi's stability theorem for Turán's theorem"
  description: >-
    A Lean 4 / Mathlib formalization of Füredi's sharp stability theorem for cliques: a
    K_{p+1}-free graph on n vertices with at least t(n, p) − t edges (t(n, p) the number of edges
    of the Turán graph) has a p-partite subgraph with at least e(G) − t edges. The proof goes
    through Füredi's partition inequality e(G) + Σᵢ e(G[Vᵢ]) ≤ e(K(V₁, …, V_p)), which also gives
    a partition with at most t edges inside the parts and edit distance at most 3t to a complete
    p-partite graph. As a corollary, the Erdős–Simonovits stability theorem for cliques: for every
    ε > 0 there is δ > 0 such that every K_{p+1}-free graph with at least (1 − 1/p) n²/2 − δn²
    edges differs from a complete p-partite graph in at most εn² edges. Mathlib has Turán's
    theorem but no stability results.
  authors:
    - "Juan Pablo Traverso Gianini"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Juan Pablo Traverso Gianini"

classification:
  arxiv: ["math.CO"]
  msc2020: ["05C35"]

sources:
  - title: "A proof of the stability of extremal graphs, Simonovits' stability from Szemerédi's regularity"
    authors:
      - "Zoltán Füredi"
    id: "doi:10.1016/j.jctb.2015.05.001"
    type: "paper"
    location: "Journal of Combinatorial Theory, Series B 115 (2015), 66–71"
    relationship: "formalizes"
    note: >-
      Theorem (K_{p+1}-free graphs with e(T_{n,p}) − t edges have a p-partite subgraph with at
      least e(G) − t edges) and its proof via the greedy maximum-degree partition. The paper's
      corollary for general forbidden graphs L with χ(L) = p + 1, which uses the removal lemma,
      is not formalized here; the clique case of the Erdős–Simonovits theorem is.
    license: "all rights reserved"
    author_endorsement: "not-contacted"
  - title: "A method for solving extremal problems in graph theory, stability problems"
    authors:
      - "Miklós Simonovits"
    type: "paper"
    location: "Theory of Graphs (Proc. Colloq., Tihany, 1966), Academic Press, New York (1968), 279–319"
    relationship: "formalizes"
    note: "The stability theorem (with Erdős), formalized here for forbidden cliques; no DOI."
    license: "all rights reserved"
    author_endorsement: "not-contacted"
  - title: "Some recent results on extremal problems in graph theory"
    authors:
      - "Paul Erdős"
    type: "paper"
    location: "Theory of Graphs (Internat. Sympos., Rome, 1966), Gordon and Breach, New York (1967), 117–123"
    relationship: "formalizes"
    note: "Erdős's announcement of the stability theorem; no DOI."
    license: "all rights reserved"
    author_endorsement: "n/a"

status:
  scope: >-
    Proved for every finite vertex type, every p ≥ 1 and every t ≥ 0 (Füredi's theorem, the
    partition inequality and the edit-distance form), and for every p ≥ 1 and ε > 0, uniformly
    over all finite graphs (Erdős–Simonovits stability for K_{p+1}).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "autonomous"
      models: ["Aristotle (Harmonic)"]
      framework: "Aristotle CLI"
      tool_setup: >-
        Produced all proofs in one run from the formal statements and a proof plan; the return was
        audited (statements and headers unchanged, no added axioms) and rebuilt locally.
      cost:
        wall_time: "under one hour"
        spend_usd: "not tracked"
        hardware: "API-only"
      prompting_notes: "Formal statements and proof plan supplied."
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code (Anthropic)"
      tool_setup: >-
        Statement design, proof plan, integration and review of the Aristotle return, and the
        Palomar packaging, checked with `lake build` and `#print axioms` (Lean v4.35.0-rc3,
        Mathlib c55e6e786f49471c72fbddbec5415808896aec1e).
      cost:
        wall_time: "about one hour"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "Natural-language instructions in Spanish, directed by the author."
  spend_usd: "subscription-based"
  notes: >-
    The results were chosen by the human author; the Lean proofs are AI-generated and
    mechanically verified (no `sorry`, axioms limited to propext, Classical.choice and Quot.sound,
    identical elaborated types for the Challenge/Solution pair).

fidelity:
  divergences: >-
    Edge counts are `Set.ncard` of Mathlib's `edgeSet`; t(n, p) is Mathlib's `turanNumber n p`
    (edges of `turanGraph n p`). A p-partition is a map f : V → Fin p, its complete p-partite
    graph is `(⊤ : SimpleGraph (Fin p)).comap f`, the edges of G inside the parts are those of
    `G \ ⊤.comap f`, and the edit distance is the edge count of the symmetric difference. A
    "p-partite subgraph" is a subgraph H ≤ G with `H.Colorable p`. The hypothesis is stated as
    t(n, p) ≤ e(G) + t (equivalent to e(G) ≥ t(n, p) − t). The stability theorem is formalized
    only for forbidden cliques K_{p+1}, with the explicit dependence δ = ε/3 hidden behind the
    existential; the general forbidden-graph version (via the removal lemma) is not included.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (AI agent in Claude Code, acting for the author)"
  notes: >-
    Agent review by Claude Opus 5.5, distinct from the mechanical verification: the agent
    compared the statements with Füredi's theorem and the Erdős–Simonovits theorem, checked that
    the Aristotle return left every statement and header unchanged, and confirmed by `lake build`,
    `#print axioms` and a comparison of the fully elaborated Challenge and Solution types that the
    proofs use no `sorry` and only propext, Classical.choice and Quot.sound. The author directed
    the work and approved the statements. No independent human mathematical review has been
    performed. The results are known; no mathematical novelty is claimed.

